name: Release Windows CLI

# Builds the standalone Windows sign.exe and attaches it to a GitHub Release.
# The .exe is a build artifact only — it is never committed to the repo.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Package standalone exe
        run: npm run package:win

      - name: Zip release folder
        shell: pwsh
        run: Compress-Archive -Path dist-win/* -DestinationPath shop-sign-creator-windows.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shop-sign-creator-windows
          path: shop-sign-creator-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: shop-sign-creator-windows.zip
